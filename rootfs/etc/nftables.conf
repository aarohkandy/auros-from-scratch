#!/usr/sbin/nft -f
# AurOS firewall: nothing on the network can start a conversation with
# this computer. Everything she starts -- web pages, video calls, email,
# updates, printing -- works, because the answers to her own traffic
# are let back in (ct state established,related).
#
# Loaded by nftables.service before the network comes up (forge enables
# it). docs/security/HARDENING.md says why each line is here, and
# tools/hardentest.sh plus tools/hardenboottest.sh fail without it.

flush ruleset

table inet auros {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # IPv6 cannot work without these: finding the router and the
        # neighbours on her own network, and "packet too big".
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded,
                      parameter-problem, nd-router-advert, nd-neighbor-solicit,
                      nd-neighbor-advert, mld-listener-query } accept

        # Her own router handing out an address (DHCP), when the answer
        # comes as a broadcast that conntrack cannot pair with the question.
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # Finding a Wi-Fi printer: ANSWERS to her own computer's search
        # (mDNS, the QR bit of the DNS header set), never questions.
        # avahi publishes nothing (disable-publishing=yes), so this
        # computer does not announce itself either.
        udp dport 5353 @th,80,1 1 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
