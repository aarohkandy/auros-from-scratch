# AurOS: NetworkManager manages EVERY network device, the cable included.
#
# This file has the same name as one network-manager ships in
# /usr/lib/NetworkManager/conf.d, and a file here replaces that one
# whole. Ubuntu's says
#
#     [keyfile]
#     unmanaged-devices=*,except:type:wifi,except:type:gsm,except:type:cdma
#
# -- every device except wifi and mobile is left alone, because on a
# Ubuntu SERVER netplan and systemd-networkd own the cable, and on the
# Ubuntu DESKTOP netplan writes a file that undoes this. This image has
# neither netplan nor networkd, so a PC plugged into its router with a
# cable came up with the cable ignored and no way to get online.
# Deliberately empty of settings.
