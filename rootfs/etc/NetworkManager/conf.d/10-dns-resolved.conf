# AurOS: NetworkManager writes /etc/resolv.conf itself.
#
# Same name as network-manager's own file in /usr/lib/NetworkManager/
# conf.d, which this one replaces. Ubuntu's says dns=systemd-resolved,
# which hands the names of the internet to systemd-resolved -- and this
# image does not have systemd-resolved (noble packages it separately and
# nothing here installs it). So a machine joined her wifi and then could
# not look up a single name. build/forge removes the build host's
# resolv.conf on purpose; this is what writes the machine's own.
[main]
dns=default
rc-manager=file
