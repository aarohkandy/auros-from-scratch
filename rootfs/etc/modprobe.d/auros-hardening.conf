# AurOS: kernel modules nobody in a house needs, which an ordinary
# program could otherwise get loaded just by asking for them (a socket
# of that family, a filesystem of that type). Each has a history of
# local root exploits: dccp (CVE-2017-6074), rds (CVE-2010-3904),
# tipc, n_hdlc (CVE-2017-2636), can, sctp, ksmbd, vivid ...
#
# `install ... /bin/false` and not `blacklist`: blacklist only stops
# loading by alias, and these are reached by name.
# docs/security/HARDENING.md; checked by tools/hardentest.sh.

# Network protocols
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n_hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install can-bcm /bin/false
install can-raw /bin/false
install can-gw /bin/false
install can-isotp /bin/false
install can-j1939 /bin/false
install atm /bin/false
# The kernel's own SMB server (AurOS shares nothing).
install ksmbd /bin/false
# A test driver for video capture, with its own exploits.
install vivid /bin/false
# Filesystems from embedded devices and 1990s Unix, never on her discs.
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
# FireWire can read a running computer's memory directly. Laptops from
# before 2012 sometimes have the port; nothing she owns uses it.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
