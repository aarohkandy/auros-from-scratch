# AurOS: this file HIDES systemd's /usr/lib/sysctl.d/99-protect-links.conf
# (a file in /etc/sysctl.d replaces the one of the same name in
# /usr/lib), which is read after every 60-*.conf and would set
# protected_fifos back to 1. Found by tools/hardentest.sh.
#
# Links, pipes and files in shared directories such as /tmp cannot be
# used to trick a program running as somebody else into writing where
# it did not mean to.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
