# AurOS: what the machine does when something goes badly wrong.
# docs/security/HARDENING.md; checked by tools/hardentest.sh.

# A kernel panic restarts the computer after 10 seconds instead of
# leaving a frozen screen forever (the kernel's own default here is 0,
# "wait for ever"). grub then starts the previous kernel if this one
# keeps failing (auros-bootchain).
kernel.panic = 10
# An oops (a bug in one driver) is NOT turned into a panic: the machine
# carries on and the rest of the session survives.
kernel.panic_on_oops = 0

# Swap is compressed memory (zram), not the disk, so swapping is cheap
# and the page cache -- the programs' own files, which on a hard disk
# are slow to read back -- is the thing worth keeping. Values above 100
# are what the kernel documentation says for in-memory swap.
vm.swappiness = 150
# zram reads one page as fast as eight; reading ahead only wastes RAM.
vm.page-cluster = 0
