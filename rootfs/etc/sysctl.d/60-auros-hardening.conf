# AurOS kernel hardening. docs/security/HARDENING.md has the reason and
# the measured cost of every line; tools/hardentest.sh fails if one goes.
#
# 60- so that it is read after Ubuntu's 10-*.conf and the packages'
# 50-*.conf, and wins where they say something weaker.

# Kernel addresses are hidden from everybody, root included. They are
# what turns a memory bug into a reliable exploit.
kernel.kptr_restrict = 2
# The kernel log is for root. It leaks addresses and hardware details.
kernel.dmesg_restrict = 1
# Only root may load BPF programs, and that cannot be undone without a
# restart. Unprivileged BPF was the entry point of a run of local root
# exploits; nothing a person runs on a desktop needs it.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# A program may only inspect (ptrace) its own children. Debuggers still
# work on what they start.
kernel.yama.ptrace_scope = 1
# No replacing the running kernel without a restart (kexec). AurOS never
# uses it, and it is a way round Secure Boot's checks.
kernel.kexec_load_disabled = 1
# Links and files in shared directories such as /tmp: see
# 99-protect-links.conf beside this file (it has to be that name to win).
# A program that changed who it runs as never leaves a memory dump.
fs.suid_dumpable = 0
# The SysRq keys can only sync the disk, remount it read-only and
# restart (16+32+128) -- never read memory or kill programs.
kernel.sysrq = 176
# Opening a terminal cannot load old line-discipline modules
# (CVE-2017-2636 class).
dev.tty.ldisc_autoload = 0
# userfaultfd is for root (it makes kernel race bugs easy to win).
vm.unprivileged_userfaultfd = 0
# io_uring is off. It was the source of most of the kernel exploits
# Google paid for in 2022-23, ChromeOS and Android turn it off, and
# programs fall back to ordinary reads and writes when it is missing.
kernel.io_uring_disabled = 2

# The network: never act as a router, never follow another machine's
# instructions to send traffic elsewhere.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
