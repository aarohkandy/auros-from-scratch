# AurOS: a desktop that keeps failing starts in safe mode (the machine's
# plain home and its own settings) instead of failing for ever. See
# /usr/lib/auros/shell-guard. `+` runs the guard as root, so the person
# whose desktop it is cannot write the record it reads.
[Service]
EnvironmentFile=-/run/auros-guard/aurshell.env
ExecStartPre=+/usr/lib/auros/shell-guard start
ExecStopPost=+/usr/lib/auros/shell-guard stopped
