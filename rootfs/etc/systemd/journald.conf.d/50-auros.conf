# AurOS: the system log can never fill her disk. systemd's default is
# 10% of the filesystem (up to 4 GB) -- on the 16 GB AurOS gets on a
# small laptop, that is a sixth of the free space, spent on text she
# will never read. 200 MB is weeks of a normal machine's log; journald
# also stops writing while less than 1 GB is free.
# docs/security/HARDENING.md; checked by tools/hardentest.sh.
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
RuntimeMaxUse=48M
MaxRetentionSec=3month
