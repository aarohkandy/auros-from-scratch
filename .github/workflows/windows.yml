# Does the installer start on real Windows?
#
# Every test before this ran the Windows half under Wine, and Wine loaded
# a manifest that real Windows refuses: the first real PC could not start
# the wizard at all ("its side-by-side configuration is incorrect",
# docs/issues/v3/01-sxs-manifest.md). These jobs run on a real Windows
# Server VM. They are read-only: preflight only reads, the wizard's
# --selftest and --navtest only render and report, and getimage writes
# files to the runner's temp directory.
#
#   build              the .exe files, from this commit, on Linux
#   windows-source     those .exe files, started on Windows
#   windows-published  the file a person downloads from image-desktop,
#                      started on Windows, pinned by its SHA-256
#   windows-known-bad  the 2026-09-25 test build must FAIL to start here,
#                      or the jobs above prove nothing
#   windows-download   WinHTTP fetches the published image pieces and
#                      the installer's own inflater checks them
name: windows

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

env:
  # The installer published on branch image-desktop. Change both lines
  # together when a new one is published.
  PUBLISHED_URL: https://github.com/ComputerDude771/auros-from-scratch/releases/download/v0.1.0-dd39389/AurOS-Setup.exe
  PUBLISHED_SHA256: 89b49e4bb7538abf56fee31399b4f71f74d1fa5f245484bed9e317e1a8a02a3d
  KNOWN_BAD_URL: https://raw.githubusercontent.com/${{ github.repository }}/d2735b6b775b1952c724aabdfdf2567246ab6c74/AurOS-Installer-test.exe
  KNOWN_BAD_SHA256: 3e32e929f57c5c2673f4547a09b44c827743d191120d22a57dfc6f28a4f3e875
  # The image the published installer downloads: its piece list, and
  # what the whole image must hash to. Change with the installer.
  IMAGE_PIECES_URL: https://github.com/ComputerDude771/auros-from-scratch/releases/download/v0.1.0-dd39389/pieces.txt
  IMAGE_SHA256: 9e3e7b9d461f2bbd1095f5cb8a82a5b07f77cdef449145fca65c51d0b7acce52
  IMAGE_BYTES: 4855955456

# One run at a time per branch. A push while one runs queues the newest
# and drops older queued ones (GitHub keeps one pending run per group), so
# a fast stream of pushes cannot fill the runner pool -- the free plan caps
# a repository at 20 concurrent jobs, and every push used to start up to
# five of these -- and a run that has started always finishes, so there is
# always a result for a recent commit.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        # Twice on 2026-10-23 this step sat in apt-get update until the
        # run was cancelled by hand. Each try is bounded and retried, so
        # a stuck mirror costs minutes, not the run.
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo timeout 150 apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo timeout 300 apt-get install -y -q mingw-w64 libxml2-utils && exit 0
            echo "::warning::apt try $i did not finish; trying again"
            sleep 10
          done
          exit 1
      - name: build/aurbridge
        run: sh build/aurbridge
      - name: manifest gate (tools/manifesttest.sh)
        run: sh tools/manifesttest.sh out/aurbridge-wizard.exe
      - name: host-side selftests
        run: |
          out/aurbridge-sim gzselftest
          out/aurbridge-sim sbselftest
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            out/aurbridge.exe
            out/aurbridge-wizard.exe

  windows-source:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with: { name: exe, path: exe }
      - name: console tool starts and passes its selftest
        shell: pwsh
        run: |
          .\exe\aurbridge.exe version
          if ($LASTEXITCODE -ne 0) { throw "version exited $LASTEXITCODE" }
          .\exe\aurbridge.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest exited $LASTEXITCODE" }
      - name: preflight on a real Windows machine (read-only)
        shell: pwsh
        run: |
          .\exe\aurbridge.exe preflight
          $code = $LASTEXITCODE
          .\exe\aurbridge.exe preflight --json | Out-File preflight.json
          # 0 = go, 1 = blocked. A server VM may well be blocked; what
          # must not happen is a crash or any other code.
          if ($code -ne 0 -and $code -ne 1) { throw "preflight exited $code" }
          Get-Content preflight.json
          # A finding that fires on a machine that does not have the thing
          # is a false alarm: this VM has no Intel storage and a
          # Microsoft virtual disk.
          if (Select-String -Path preflight.json -Pattern '"intel-rst"' -Quiet) { throw "intel-rst on a VM without Intel storage" }
          exit 0
      - name: the storage check finds the real controller's driver
        shell: pwsh
        run: |
          # Asked independently of AurBridge: the drivers from the system
          # disk up through its parents, the way Device Manager has them.
          $n = (Get-Disk | Where-Object IsSystem | Select-Object -First 1).Number
          $id = (Get-CimInstance Win32_DiskDrive | Where-Object Index -eq $n).PNPDeviceID
          $chain = @()
          while ($id) {
            $svc = (Get-PnpDeviceProperty -InstanceId $id -KeyName DEVPKEY_Device_Service -ErrorAction SilentlyContinue).Data
            $chain += "$id [$svc]"
            if ($svc -and $svc -ne 'disk' -and -not $ctl) { $ctl = $svc }
            $id = (Get-PnpDeviceProperty -InstanceId $id -KeyName DEVPKEY_Device_Parent -ErrorAction SilentlyContinue).Data
          }
          $chain
          if (-not $ctl) { throw "no controller driver found above the system disk" }
          "the system disk's controller is run by $ctl"
          # Told to treat that driver as Intel's, the check has to name it.
          $env:AURBRIDGE_TEST_RST_SERVICE = $ctl
          .\exe\aurbridge.exe preflight --json | Out-File rst.json
          $f = Get-Content rst.json -Raw | ConvertFrom-Json
          $hit = $f.findings | Where-Object id -eq 'intel-rst'
          if (-not $hit) { throw "told $ctl is Intel's, the check did not find it: the walk is not reaching the controller" }
          if ($hit.detail -notmatch [regex]::Escape($ctl)) { throw "it fired, but not about $ctl : $($hit.detail)" }
          "found: $($hit.detail)"
          exit 0
      - name: the install switches Fast Startup off itself
        shell: pwsh
        run: |
          # Switched ON first, the way most home PCs have it, and the
          # preflight must then say it will be switched off -- not refuse.
          $k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power'
          Set-ItemProperty -Path $k -Name HiberbootEnabled -Value 1 -Type DWord
          powercfg /hibernate on 2>&1 | Out-String | Write-Output
          $f = (.\exe\aurbridge.exe preflight --json | Out-String | ConvertFrom-Json).findings |
                 Where-Object id -eq 'fast-startup'
          if (-not $f) { throw "with Fast Startup on, preflight did not notice" }
          if ($f.severity -ne 'info') { throw "Fast Startup is still a refusal: $($f.severity)" }
          .\exe\aurbridge.exe fast-startup-off
          if ($LASTEXITCODE -ne 0) { throw "fast-startup-off exited $LASTEXITCODE" }
          $v = (Get-ItemProperty -Path $k -Name HiberbootEnabled).HiberbootEnabled
          if ($v -ne 0) { throw "HiberbootEnabled is still $v" }
          if (Test-Path "$env:SystemDrive\hiberfil.sys") { throw "hiberfil.sys is still there" }
          $f = (.\exe\aurbridge.exe preflight --json | Out-String | ConvertFrom-Json).findings |
                 Where-Object id -eq 'fast-startup'
          if ($f) { throw "after switching it off, preflight still mentions Fast Startup" }
          "Fast Startup was on, and the installer switched it off"
          exit 0
      - name: the Fix button frees space, and never follows a link out of Temp
        shell: pwsh
        timeout-minutes: 25
        run: |
          # Leftovers in both temp folders must go. A junction in %TEMP%
          # pointing at somebody's folder must go as a link, and the file
          # behind it must still be there afterwards: a recursive delete
          # that follows it would delete their files.
          $keep = "$env:SystemDrive\keep-me"
          New-Item -ItemType Directory -Force $keep | Out-Null
          Set-Content "$keep\photo.txt" 'somebody''s file'
          New-Item -ItemType Directory -Force "$env:TEMP\aurtest\deeper" | Out-Null
          Set-Content "$env:TEMP\aurtest\deeper\junk.tmp" 'junk'
          Set-Content "$env:WINDIR\Temp\aurtest-junk.tmp" 'junk'
          cmd /c mklink /J "$env:TEMP\aurtest-link" $keep | Out-Null
          if (-not (Test-Path "$env:TEMP\aurtest-link\photo.txt")) { throw "the junction was not made" }
          .\exe\aurbridge.exe fix insufficient-space
          if ($LASTEXITCODE -ne 0) { throw "fix insufficient-space exited $LASTEXITCODE" }
          if (Test-Path "$env:TEMP\aurtest\deeper\junk.tmp") { throw "a file in %TEMP% is still there" }
          if (Test-Path "$env:WINDIR\Temp\aurtest-junk.tmp") { throw "a file in Windows\Temp is still there" }
          if (Test-Path "$env:TEMP\aurtest-link") { throw "the junction is still there" }
          if (-not (Test-Path "$keep\photo.txt")) { throw "THE FILE BEHIND THE JUNCTION WAS DELETED" }
          # Nothing a program cannot fix is attempted.
          .\exe\aurbridge.exe fix firmware-bios
          if ($LASTEXITCODE -ne 2) { throw "fix firmware-bios exited $LASTEXITCODE, not 2" }
          "temp folders emptied; the file behind the link is untouched"
          exit 0
      - name: after a restart it asks for, the installer opens again by itself
        shell: pwsh
        run: |
          $tn = 'AurOS installer - continue'
          .\exe\aurbridge.exe resume-arm
          if ($LASTEXITCODE -ne 0) { throw "resume-arm exited $LASTEXITCODE" }
          $x = schtasks.exe /query /tn $tn /xml | Out-String
          if ($LASTEXITCODE -ne 0) { throw "the task was not created" }
          if ($x -notmatch '--resume') { throw "the task does not pass --resume" }
          if ($x -notmatch 'aurbridge\.exe') { throw "the task does not start the installer" }
          if ($x -notmatch 'LogonTrigger') { throw "the task does not run at sign-in" }
          if ($x -notmatch 'HighestAvailable') { throw "the task does not run with the rights the installer needs" }
          .\exe\aurbridge.exe resume-done
          schtasks.exe /query /tn $tn 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the task is still there after resume-done" }
          "the task is made, starts the installer with --resume at sign-in, and goes again"
          exit 0
      - name: an earlier attempt's files on the start-up partition count as room
        shell: pwsh
        run: |
          # This VM's EFI partition is 95 MB with about 61 MB free. Fill it
          # to 10 MB free, first with a file where an earlier AurOS attempt
          # leaves its own (which the next one replaces, so it is room),
          # then with somebody else's file (which is not). The first must
          # pass and the second must refuse, or the check is not looking.
          # The VM is thrown away after the run.
          mountvol S: /S
          if (-not (Test-Path S:\EFI)) { throw "the EFI partition did not mount" }
          function Fill($path) {
            $free = ([System.IO.DriveInfo]::new('S')).AvailableFreeSpace
            fsutil file createnew $path ([int64]($free - 10MB)) | Out-Null
          }
          function EspFinding() {
            (.\exe\aurbridge.exe preflight --json | Out-String | ConvertFrom-Json).findings |
              Where-Object { $_.id -like 'esp-*' } | Select-Object -First 1
          }
          New-Item -ItemType Directory -Force S:\EFI\AurOS | Out-Null
          Fill S:\EFI\AurOS\staging.img
          $ours = EspFinding
          Remove-Item S:\EFI\AurOS -Recurse -Force
          Fill S:\EFI\not-aurOS.bin
          $theirs = EspFinding
          Remove-Item S:\EFI\not-aurOS.bin -Force
          mountvol S: /D
          "with AurOS's own leftovers: $($ours.id): $($ours.detail)"
          "with somebody else's file:  $($theirs.id): $($theirs.detail)"
          if ($ours.id -ne 'esp-space') { throw "an earlier attempt's files were not counted as room" }
          if ($theirs.id -ne 'esp-low-space') { throw "a full partition was not refused: the check is not looking" }
          exit 0
      - name: wizard starts, navigates, runs preflight
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\exe\aurbridge-wizard.exe).Path
          $d = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\wiz"
          $p = Start-Process -FilePath $exe -ArgumentList '--navtest', $d.FullName -Wait -PassThru
          Get-Content "$d\navtest.log"
          if ($p.ExitCode -ne 0) { throw "--navtest exited $($p.ExitCode)" }
          if (Select-String -Path "$d\navtest.log" -Pattern '\[FAIL\]' -Quiet) { throw "navtest has FAIL lines" }
          if (-not (Select-String -Path "$d\navtest.log" -Pattern '\[PASS\]' -Quiet)) { throw "navtest passed nothing" }
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $d.FullName -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "--selftest did not finish in 3 minutes" }
          Get-Content "$d\selftest.log"
          if (-not (Select-String -Path "$d\selftest.log" -Pattern 'window created   : yes' -Quiet)) { throw "no window" }
          if (-not (Select-String -Path "$d\selftest.log" -Pattern 'preflight done   : 1' -Quiet)) { throw "preflight did not finish" }
          # A screen reader, asking Windows for the window's accessible
          # object, gets the page's words and its button by name.
          if (-not (Select-String -Path "$d\selftest.log" -Pattern 'screen reader    : "[^"]{10,}", [1-9][0-9]* parts, button "[^"]+"' -Quiet)) { throw "a screen reader gets nothing from the window" }
      - name: the installer says its own name, and has its icon
        shell: pwsh
        run: |
          # What SmartScreen's "Run anyway", the administrator question and
          # the Downloads folder show before it runs (src/aurbridge/aurbridge-info.rc).
          $v = (Get-Item .\exe\aurbridge-wizard.exe).VersionInfo
          $v | Format-List ProductName, FileDescription, CompanyName, FileVersion, OriginalFilename
          if ($v.ProductName -ne 'AurOS') { throw "ProductName is '$($v.ProductName)'" }
          if ($v.FileDescription -ne 'AurOS Setup') { throw "FileDescription is '$($v.FileDescription)'" }
          if ($v.CompanyName -ne 'AurOS') { throw "CompanyName is '$($v.CompanyName)'" }
          Add-Type -AssemblyName System.Drawing
          $i = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path .\exe\aurbridge-wizard.exe).Path)
          $b = $i.ToBitmap()
          $c = $b.GetPixel([int]($b.Width / 2), [int]($b.Height / 2))
          "icon centre: $c"
          # the teal diamond, not Windows' blank program icon
          if (-not ($c.G -gt 150 -and $c.B -gt 130 -and $c.R -lt 160)) { throw "the icon is not AurOS's: centre pixel $c" }
      - name: wizard starts the way a double-click starts it
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path .\exe\aurbridge-wizard.exe).Path -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the wizard exited on its own, code $($p.ExitCode)" }
          $p.Kill()
          "the wizard was running after 8 seconds"

  windows-published:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: download what a person downloads
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:PUBLISHED_URL -OutFile AurOS-Installer-test.exe
          $h = (Get-FileHash AurOS-Installer-test.exe -Algorithm SHA256).Hash.ToLower()
          "SHA-256 $h"
          if ($h -ne $env:PUBLISHED_SHA256) { throw "the published file is not the one this workflow was pinned to" }
      - name: it starts, navigates, runs preflight
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\AurOS-Installer-test.exe).Path
          $d = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\pub"
          $p = Start-Process -FilePath $exe -ArgumentList '--navtest', $d.FullName -Wait -PassThru
          Get-Content "$d\navtest.log"
          if ($p.ExitCode -ne 0) { throw "--navtest exited $($p.ExitCode)" }
          if (Select-String -Path "$d\navtest.log" -Pattern '\[FAIL\]' -Quiet) { throw "navtest has FAIL lines" }
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $d.FullName -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "--selftest did not finish in 3 minutes" }
          Get-Content "$d\selftest.log"
          if (-not (Select-String -Path "$d\selftest.log" -Pattern 'window created   : yes' -Quiet)) { throw "no window" }
          if (-not (Select-String -Path "$d\selftest.log" -Pattern 'preflight done   : 1' -Quiet)) { throw "preflight did not finish" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the wizard exited on its own, code $($p.ExitCode)" }
          $p.Kill()
          "the published installer was running after 8 seconds"

  windows-known-bad:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: the build that failed on the first real PC fails here too
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:KNOWN_BAD_URL -OutFile bad.exe
          $h = (Get-FileHash bad.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:KNOWN_BAD_SHA256) { throw "not the known-bad file: $h" }
          $started = $true
          try {
            $p = Start-Process -FilePath (Resolve-Path .\bad.exe).Path -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 5
            if ($p.HasExited) { $started = $false; "exited with $($p.ExitCode)" } else { $p.Kill() }
          } catch {
            $started = $false
            "refused, as on the real PC: $($_.Exception.Message)"
          }
          if ($started) { throw "the known-bad build started: this machine cannot tell a good installer from a bad one" }

  windows-download:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with: { name: exe, path: exe }
      - name: WinHTTP fetches the published image, and it checks out
        shell: pwsh
        run: |
          $list = "$env:RUNNER_TEMP\pieces.txt"
          Invoke-WebRequest -Uri $env:IMAGE_PIECES_URL -OutFile $list
          $out = "$env:RUNNER_TEMP\auros-desktop.img"
          .\exe\aurbridge.exe getimage $list $out $env:IMAGE_SHA256 $env:IMAGE_BYTES | Tee-Object -FilePath getimage.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "getimage exited $code" }
          if (-not (Select-String -Path getimage.log -Pattern 'verdict=ok' -Quiet)) { throw "no verdict=ok" }

  # THE FAST PATH'S WINDOWS HALF, on real Windows (docs/AURBRIDGE.md,
  # "Fast path"). A throwaway VHDX made with diskpart: GPT, an NTFS
  # partition full of known files, a recovery-shaped partition after it
  # (the OEM layout, so the shrink makes a GAP and not room at the end).
  # Then the ENGINE'S OWN code (`aurbridge gapselftest`): Windows' online
  # shrink, the shared planner, the gap writes, the read-back, both
  # fences -- and, checked here independently, the files, chkdsk, and the
  # raw bytes in the gap; then the undo grows it back. Never the runner's
  # own disk: gapselftest refuses the system disk and any disk whose GPT
  # GUID is not the one it is handed.
  gapselftest:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: exe, path: exe }
      - name: a throwaway disk shaped like a PC's, full of known files
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\gap.vhdx"
          @"
          create vdisk file="$vhd" maximum=3072 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          "@ | Set-Content "$env:RUNNER_TEMP\mk.txt"
          diskpart /s "$env:RUNNER_TEMP\mk.txt" | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "diskpart exited $LASTEXITCODE" }
          $n = (Get-DiskImage -ImagePath $vhd).Number
          if ($null -eq $n) { Get-Disk | Format-Table Number, FriendlyName, Location, PartitionStyle | Out-String | Write-Output; throw "the new disk is not visible" }
          $d = Get-Disk -Number $n
          if ($d.PartitionStyle -ne 'RAW' -or $d.IsSystem -or $d.IsBoot) { throw "disk $n is not the new empty disk" }
          Initialize-Disk -Number $d.Number -PartitionStyle GPT
          $p = New-Partition -DiskNumber $d.Number -Size 2048MB -AssignDriveLetter
          Format-Volume -Partition $p -FileSystem NTFS -NewFileSystemLabel AURGAP -Confirm:$false | Out-Null
          # WinRE's place: right after Windows, so the shrink makes a gap between them.
          New-Partition -DiskNumber $d.Number -Size 512MB -GptType '{de94bba4-06d1-4d40-a16a-bfd50179d6ac}' | Out-Null
          $p = Get-Partition -DiskNumber $d.Number -PartitionNumber $p.PartitionNumber
          $L = "$($p.DriveLetter):"
          # Known files: 300 of them, 1 KB to 2 MB, random content.
          New-Item -ItemType Directory -Force "$L\photos" | Out-Null
          $rng = [System.Random]::new(23)
          for ($i = 0; $i -lt 300; $i++) {
            $b = [byte[]]::new($rng.Next(1024, 2MB)); $rng.NextBytes($b)
            [System.IO.File]::WriteAllBytes("$L\photos\img$i.bin", $b)
          }
          Get-ChildItem "$L\photos" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) $([IO.Path]::GetFileName($_.Path))" } | Set-Content "$env:RUNNER_TEMP\before.txt"
          Get-Partition -DiskNumber $d.Number | Format-Table PartitionNumber, Offset, Size, Type, GptType -AutoSize | Out-String | Write-Output
          "DISK=$($d.Number)" | Out-File -Append $env:GITHUB_ENV
          "PART=$($p.PartitionNumber)" | Out-File -Append $env:GITHUB_ENV
          "LETTER=$L" | Out-File -Append $env:GITHUB_ENV
          "GUID=$((Get-Disk -Number $d.Number).Guid)" | Out-File -Append $env:GITHUB_ENV
          "ORIG=$($p.Size)" | Out-File -Append $env:GITHUB_ENV
      - name: it refuses the runner's own disk and a disk it was not named
        shell: pwsh
        run: |
          $sys = (Get-Disk | Where-Object IsSystem | Select-Object -First 1)
          .\exe\aurbridge.exe gapselftest $sys.Number 1 $sys.Guid write 64 16 | Tee-Object -FilePath sys.log
          if ($LASTEXITCODE -eq 0) { throw "IT RAN ON THE SYSTEM DISK" }
          if (-not (Select-String -Path sys.log -Pattern 'running from' -Quiet)) { throw "refused, but not for being the system disk" }
          .\exe\aurbridge.exe gapselftest $env:DISK $env:PART '{00000000-0000-0000-0000-000000000000}' write 64 16 | Tee-Object -FilePath guid.log
          if ($LASTEXITCODE -eq 0) { throw "it ran on a disk it was not named" }
          if (-not (Select-String -Path guid.log -Pattern 'not the disk that was named' -Quiet)) { throw "refused, but not for the GUID" }
          "both refused"
      - name: the engine shrinks with Windows' own shrink and writes only into the gap
        shell: pwsh
        run: |
          .\exe\aurbridge.exe gapselftest $env:DISK $env:PART $env:GUID write 768 256 | Tee-Object -FilePath write.log
          if ($LASTEXITCODE -ne 0) { throw "gapselftest write exited $LASTEXITCODE" }
          if (-not (Select-String -Path write.log -Pattern 'verdict=ok phase=write' -Quiet)) { throw "no verdict=ok" }
          $refused = (Select-String -Path write.log -Pattern 'fence1 refused=').Count
          if ($refused -ne 5) { throw "fence one refused $refused writes, not 5" }
          if (-not (Select-String -Path write.log -Pattern 'fence2 ntfs=1' -Quiet)) { throw "Windows did not refuse the raw write into NTFS" }
          Get-Partition -DiskNumber $env:DISK | Format-Table PartitionNumber, Offset, Size, GptType -AutoSize | Out-String | Write-Output
      - name: checked independently while it is shrunk -- the files, chkdsk, and the raw bytes in the gap
        shell: pwsh
        run: |
          $now = (Get-Partition -DiskNumber $env:DISK -PartitionNumber $env:PART).Size
          if ($now -ge [int64]$env:ORIG) { throw "not smaller: $now" }
          Get-ChildItem "$env:LETTER\photos" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) $([IO.Path]::GetFileName($_.Path))" } | Set-Content "$env:RUNNER_TEMP\during.txt"
          if (Compare-Object (Get-Content "$env:RUNNER_TEMP\before.txt") (Get-Content "$env:RUNNER_TEMP\during.txt")) { throw "A FILE CHANGED" }
          "300 files identical"
          $r = Repair-Volume -DriveLetter $env:LETTER[0] -Scan
          "Repair-Volume -Scan: $r"
          if ("$r" -ne 'NoErrorsFound') { throw "chkdsk found errors: $r" }
          # The gap, read raw from the disk by .NET, not by the engine.
          $line = Select-String -Path write.log -Pattern 'gapselftest write seconds' | Select-Object -First 1
          if ($line.Line -notmatch 'root_off=(\d+) root_len=(\d+) root_sha=([0-9a-f]+)') { throw "no root extent in the log" }
          $off = [int64]$Matches[1]; $len = [int64]$Matches[2]; $want = $Matches[3]
          $fs = [System.IO.FileStream]::new("\\.\PhysicalDrive$($env:DISK)", 'Open', 'Read', 'ReadWrite', 1MB, [System.IO.FileOptions]::None)
          $fs.Seek($off, 'Begin') | Out-Null
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $buf = [byte[]]::new(1MB); $left = $len
          while ($left -gt 0) { $k = $fs.Read($buf, 0, [Math]::Min(1MB, $left)); if ($k -le 0) { throw "short read" }; $sha.TransformBlock($buf, 0, $k, $null, 0) | Out-Null; $left -= $k }
          $sha.TransformFinalBlock([byte[]]::new(0), 0, 0) | Out-Null
          $fs.Dispose()
          $got = -join ($sha.Hash | ForEach-Object { $_.ToString('x2') })
          "gap bytes read raw: $got"
          if ($got -ne $want) { throw "the gap does not hold what the engine says it wrote: $got vs $want" }
      - name: the undo grows it back, and the files are still the files
        shell: pwsh
        run: |
          .\exe\aurbridge.exe gapselftest $env:DISK $env:PART $env:GUID undo $env:ORIG | Tee-Object -FilePath undo.log
          if ($LASTEXITCODE -ne 0) { throw "gapselftest undo exited $LASTEXITCODE" }
          $now = (Get-Partition -DiskNumber $env:DISK -PartitionNumber $env:PART).Size
          if ($now -ne [int64]$env:ORIG) { throw "after the undo it is $now, not $env:ORIG" }
          Get-ChildItem "$env:LETTER\photos" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) $([IO.Path]::GetFileName($_.Path))" } | Set-Content "$env:RUNNER_TEMP\after.txt"
          if (Compare-Object (Get-Content "$env:RUNNER_TEMP\before.txt") (Get-Content "$env:RUNNER_TEMP\after.txt")) { throw "A FILE CHANGED" }
          $r = Repair-Volume -DriveLetter $env:LETTER[0] -Scan
          if ("$r" -ne 'NoErrorsFound') { throw "chkdsk found errors after the undo: $r" }
          "grown back to $now bytes; 300 files identical; chkdsk clean"
      - name: with BitLocker on the throwaway disk, if this runner has BitLocker
        shell: pwsh
        run: |
          if (-not (Get-Command Enable-BitLocker -ErrorAction SilentlyContinue)) {
            "SKIPPED: this runner has no BitLocker (the feature is not installed, and installing it needs a restart)"
            exit 0
          }
          $pw = ConvertTo-SecureString 'AurOS-test-only-1234' -AsPlainText -Force
          Enable-BitLocker -MountPoint $env:LETTER -PasswordProtector -Password $pw -UsedSpaceOnly -SkipHardwareTest | Out-Null
          for ($i = 0; $i -lt 120 -and (Get-BitLockerVolume $env:LETTER).VolumeStatus -ne 'FullyEncrypted'; $i++) { Start-Sleep 5 }
          Get-BitLockerVolume $env:LETTER | Format-List MountPoint, VolumeStatus, ProtectionStatus, EncryptionPercentage | Out-String | Write-Output
          .\exe\aurbridge.exe gapselftest $env:DISK $env:PART $env:GUID write 768 256 | Tee-Object -FilePath bl.log
          if ($LASTEXITCODE -ne 0) { throw "with BitLocker on, gapselftest write exited $LASTEXITCODE" }
          Get-ChildItem "$env:LETTER\photos" | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash) $([IO.Path]::GetFileName($_.Path))" } | Set-Content "$env:RUNNER_TEMP\bl.txt"
          if (Compare-Object (Get-Content "$env:RUNNER_TEMP\before.txt") (Get-Content "$env:RUNNER_TEMP\bl.txt")) { throw "A FILE CHANGED under BitLocker" }
          .\exe\aurbridge.exe gapselftest $env:DISK $env:PART $env:GUID undo $env:ORIG
          if ($LASTEXITCODE -ne 0) { throw "with BitLocker on, the undo exited $LASTEXITCODE" }
          "shrink, gap write and undo all worked with BitLocker on; nothing was decrypted"
